<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#94070a">
  <meta id="pageDescription" name="description" content="合成PKU·燕园校徽合成小游戏">
  <title>合成PKU</title>
  <link rel="icon" href="assets/badges/pku.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-left">
        <button
          class="icon-button"
          id="soundButton"
          type="button"
          tabindex="-1"
          aria-label="关闭声音"
          aria-pressed="true"
        >
          <span class="sound-icon" id="soundIcon" aria-hidden="true"></span>
        </button>
        <div class="metric metric-score">
          <span>得分</span>
          <strong id="score">0</strong>
        </div>
      </div>

      <div class="brand">
        <h1 id="gameTitle">合成PKU</h1>
        <p>左右拖动·松手落下</p>
      </div>

      <div class="topbar-right">
        <div class="metric">
          <span>最高</span>
          <strong id="bestScore">0</strong>
        </div>
        <button class="icon-button restart-button" id="restartButton" type="button" tabindex="-1" disabled aria-label="重开">
          <svg class="restart-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M18.4 2.6v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="board">
      <canvas
        id="gameCanvas"
        width="640"
        height="992"
      ></canvas>

      <div
        class="overlay"
        id="gameOverOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gameOverTitle"
        aria-describedby="gameOverMessage"
        hidden
      >
        <div class="overlay-card confirm-card">
          <h2 id="gameOverTitle">本局结束</h2>
          <p class="confirm-copy" id="gameOverMessage">差一点就更大了</p>
          <div class="result-row">
            <div>
              <span>等级</span>
              <div class="highest-item">
                <img id="highestItemImage" alt="">
              </div>
            </div>
            <div><span>得分</span><strong id="finalScore">0</strong></div>
          </div>
          <p class="new-record" id="newRecord" hidden>新纪录！</p>
          <div class="confirm-actions game-over-actions">
            <button class="small-button confirm-button" id="againButton" type="button" tabindex="-1">再合一次</button>
          </div>
        </div>
      </div>

      <div
        class="overlay"
        id="restartConfirmOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="restartConfirmTitle"
        hidden
      >
        <div class="overlay-card confirm-card">
          <h2 id="restartConfirmTitle">重新开始？</h2>
          <p class="confirm-copy">当前进度将会丢失</p>
          <div class="confirm-actions">
            <button class="small-button" id="restartCancelButton" type="button" tabindex="-1">取消</button>
            <button class="small-button confirm-button" id="restartConfirmButton" type="button" tabindex="-1">重新开始</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="game-config.js"></script>
  <script src="game.js"></script>
</body>
</html>
